# Quality gates. Runs on every pull request, and on every push to main through main.yml, which deploys the docs and
# runs the release step only after these pass. These jobs are the required status checks on main.

name: CI

on:
    pull_request:
    workflow_call:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    FORCE_COLOR: 1

jobs:
    commits:
        name: Commit messages
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci --ignore-scripts
            - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

    lint:
        name: Lint and typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm run build:plugin
            # The docs and the MCP package lint against generated metadata.
            - run: npm run build:data --workspace @ptrn/mcp
            - run: npm run lint
            - run: npx tsx .scripts/tasks/lint-components.ts
              working-directory: packages/react
            - run: npm run check:css-vars --workspace @ptrn/react --workspace @ptrn/web
            - run: npx prettier --check .
            # The stylesheets and the token module in @ptrn/styles are built from tokens/ and committed; they must match.
            - name: Built token files match the committed ones
              run: git diff --exit-code --stat -- packages/styles

    unit:
        name: Unit tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm run build:data --workspace @ptrn/mcp
            - run: npm test --workspace @ptrn/react
            - run: npm test --workspace @ptrn/mcp
            # Runs the compiled Figma plugin against a fake file and builds its token files with @ptrn/styles.
            - run: npm test --workspace ptrn-figma-plugin

    consumer:
        name: Consumer smoke test (React ${{ matrix.react }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                react: [18, 19]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run build
            # Packs the publishable packages, installs the tarballs into a fresh project next to this React major,
            # type-checks against the export maps and server-renders a component with react-dom/server.
            - run: node scripts/consumer-smoke.mjs ${{ matrix.react }}

    web:
        name: Web Components (Playwright)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npx playwright install --with-deps chromium
            - run: npm test --workspace @ptrn/web
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-web
                  path: packages/web/playwright-report
                  retention-days: 7

    docs:
        name: Docs site (Playwright)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm run build:docs
            - run: npx playwright install --with-deps chromium
            - run: npm test --workspace ptrn-docs
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-docs
                  path: docs/playwright-report
                  retention-days: 7

    accessibility:
        name: Accessibility matrix (${{ matrix.theme }})
        runs-on: ubuntu-latest
        # Reports but does not block yet: the matrix found real violations on day one (AvatarGroup, Field, InlineAlert
        # in every theme, and the docs demo background in the dark theme). Remove continue-on-error and make these
        # jobs required once those are fixed; the job must never be skipped or quarantined.
        continue-on-error: true
        strategy:
            fail-fast: false
            matrix:
                theme: [default, project-theme, project-theme-dark]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm run build:docs
            - run: npx playwright install --with-deps chromium
            - run: npm run test:a11y --workspace ptrn-docs
              env:
                  PTTRN_THEME: ${{ matrix.theme }}
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: a11y-${{ matrix.theme }}
                  path: docs/playwright-report
                  retention-days: 7

    pack:
        name: Package contents
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm run build --workspace @ptrn/mcp
            - name: Check what every publishable package would ship
              run: npm run check:pack
