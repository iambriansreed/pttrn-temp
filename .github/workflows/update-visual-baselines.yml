# Renders a fresh set of visual regression baselines on the platform CI compares against (Linux, Playwright's pinned
# Chromium) and uploads them as an artifact. Download it, replace docs/tests/visual/__screenshots__ with its contents,
# review the diff, and commit. Run it after an intended visual change, never to make a red check pass unreviewed.

name: Update visual baselines

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    render:
        name: Render baselines
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm run build:docs
            - run: npx playwright install --with-deps chromium
            - run: npm run test:visual:update --workspace ptrn-docs
            - uses: actions/upload-artifact@v7
              with:
                  name: visual-baselines
                  path: docs/tests/visual/__screenshots__
                  retention-days: 7
